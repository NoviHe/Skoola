name: tests

# Dinonaktifkan dari trigger push/PR otomatis sesuai instruksi.
# Hanya dapat dijalankan secara manual via GitHub Actions UI (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, intl, zip, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Build Frontend
        run: npm run build

      - name: Run CI Checks
        run: |
          npm run check
          npm run types:check
          vendor/bin/pint --test
          php artisan test
